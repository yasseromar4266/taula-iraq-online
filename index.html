:"Pass",uYourTurn:"Your turn: play a glowing card",uMustDraw:"Nothing to play \u2013 draw a card",uDrewPlayable:"Your drawn card can be played: play it or pass",uPickColor:"Choose a colour",uSkipped:"{name} was skipped",uGotDraw:"{name} drew {n} and was skipped",uChose:"{name} chose {color}",uRoundWon:"You went out and won the round!",uRoundLost:"{name} won the round",uMatchLost:"{name} won the match",uTo:"Match to {n} points.",uErr:"That card can\u2019t be played now",unoHowTitle:"UNO rules",unoHow:["2 to 4 players, 7 cards each.","On your turn play a card matching the top card\u2019s colour or number/symbol, or a Wild.","Can\u2019t play? Draw one. If it can be played you may play it, otherwise your turn passes.","\u2298 skips the next player, \u21C4 reverses direction (a skip with two players), +2 makes the next player draw two and miss their turn.","\u2726 lets you pick the colour; +4 picks the colour and the next player draws four and misses their turn. No stacking.","First out scores the cards left in the others\u2019 hands: numbers face value, actions 20, wilds 50.","First to 300 points wins the match."],unoControls:"Tap a glowing card to play it (pick a colour for wilds). Tap \u201CDraw\u201D when you can\u2019t play.",mheibesName:"Mheibes",mheibesDesc:"The Baghdadi ring game for two teams.",mheibesDesc2:"Your team against the computer\u2019s, or against a friend online. Hide the ring \u2013 or read their faces and find it.",mhYourTeam:"Your team",mhCompTeam:"Computer team",mhTeamOf:"{name}\u2019s team",mhTo:"to {n}",mhMate:"Teammate {n}",mhRival:"Rival",mhHideHint:"Your turn to hide: tap the fist that will hold the ring",mhTheyHide:"The other team is hiding the ring\u2026",mhTheyGuess:"The other team is searching\u2026",mhPickHint:"Pick one of their fists. Watch for the one that twitches!",mhChoose:"\u201CBat\u201D if it\u2019s empty, \u201CJibah\u201D if it holds the ring",mhBat:"Bat (empty)",mhJib:"Jibah (it\u2019s here)",mhEmpty:"Empty! Keep going",mhThey
