), no wrap-around.","A joker stands for any card, but every group needs at least two real cards, and a joker on the table can\u2019t be taken back.","Your first meld must total 51 or more. If you take the discard before opening, you must open that same turn.","Once opened you may add cards to any meld on the table, yours or others\u2019.","Number cards count their value, pictures 10, the ace 1 with low cards and 10 next to the king, a joker as the card it replaces.","First to get rid of all cards wins the round and scores 0. Not opened = 100; opened = the value of the cards left in hand (a joker in hand is 25).","Rounds go on; the lowest total leads. The round winner deals next."],kunkanControls:"Tap the stock or the discard to draw. Tap cards to select them: \u201CMake group\u201D stages your opening until it reaches 51, then \u201CLay all\u201D. After opening, select a card and tap a glowing meld to add it. \u201CThrow\u201D discards the selected card.",snakesName:"Snakes & Ladders",snakesDesc:"Climb the ladders, dodge the snakes.",snakesDesc2:"2 to 4 players. Roll, climb ladders, avoid snakes. First to 100 wins.",slVsComputer:"vs computer",slStart:"Start",slTheirTurn:"{name}\u2019s turn\u2026",slWinner:"{name} reached 100 and won",slLadder:"{name} climbed a ladder to {to}! \u{1FA9C}",slSnake:"{name} was bitten and slid to {to} \u{1F40D}",slOver:"{name} rolled {n} \u2013 needs the exact number",snakesHowTitle:"Snakes & Ladders rules",snakesHow:["2 to 4 players, everyone starts off the board.","Roll the die and move forward that many squares.","Land at the foot of a ladder to climb it; land on a snake\u2019s head to slide down to its tail.","A six gives another roll.","You need the exact number to reach 100; if you overshoot you stay put.","First to 100 wins."],snakesControls:"Tap the die to roll; your piece moves by itself.",unoName:"UNO",unoDesc:"The colours-and-numbers classic.",unoDesc2:"2 to 4 players. Match colour or number, use the action cards, first to emp
