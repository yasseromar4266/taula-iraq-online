2 players",dFour:"4 players (teams)",dQuick2:"Quick match (2)",dRoom2:"Private room for 2",dRoom4:"Private room for 4 (teams)",dFill:"Start now \u2014 the computer fills empty seats",dFillNote:"Wait for friends to join with the code, or start and let the computer play the empty seats. Your partner sits opposite you.",dBotTook:"A player left; the computer took their seat",player:"Player",emptySeat:"Empty seat",shareCode4:"Send the code to your friends. The match starts when four have joined, or you can start it now.",lu_red:"red",lu_green:"green",lu_yellow:"yellow",lu_blue:"blue",luPlayers:"Players",luTapRoll:"Tap the die",luYourRoll:"Your turn \u2014 roll the die",luRollAgain:"A six! Roll again",luPick:"Pick the piece to move",luMoving:"Moving\u2026",luTheirTurn:"{name}\u2019s turn ({color})",luNoMoveMe:"You rolled {n} \u2014 no move",luNoMove:"{name} rolled {n} \u2014 no move",luThreeSixes:"{name}: three sixes in a row, turn lost",luHit:"You sent {name}\u2019s piece home!",luGotHit:"{name} sent your piece home",luHitOther:"{a} sent {b}\u2019s piece home",luWinner:"{name} brought all pieces home and won",luOthers:"Opponents",luStartNow:"Start with who\u2019s here",luStartNote:"Start with whoever has joined (two or more), or let the computer fill the empty seats up to four.",ludoHowTitle:"Ludo rules",ludoHow:["2 to 4 players, each with 4 pieces of their colour.","A piece leaves home only on a 6. A 6 also gives another roll, but three 6s in a row lose the turn.","Pieces go once round the board, then up their own coloured lane to the centre.","Land on an opponent\u2019s piece to send it home \u2014 except on safe squares: the coloured start squares and the stars.","You need the exact number to reach the centre.","First to bring all four pieces to the centre wins."],ludoControls:"Tap the die to roll, then tap a glowing piece. With only one possible move, it moves by itself.",kunkanDesc2:"2 to 5 players, two decks and two jokers, first meld 51.",kPlayers:"players",kOpene :"Pass",uYourTurn:"Your turn: play a glowing card",uMustDraw:"Nothing to play \u2013 draw a card",uDrewPlayable:"Your drawn card can be played: play it or pass",uPickColor:"Choose a colour",uSkipped:"{name} was skipped",uGotDraw:"{name} drew {n} and was skipped",uChose:"{name} chose {color}",uRoundWon:"You went out and won the round!",uRoundLost:"{name} won the round",uMatchLost:"{name} won the match",uTo:"Match to {n} points.",uErr:"That card can\u2019t be played now",unoHowTitle:"UNO rules",unoHow:["2 to 4 players, 7 cards each.","On your turn play a card matching the top card\u2019s colour or number/symbol, or a Wild.","Can\u2019t play? Draw one. If it can be played you may play it, otherwise your turn passes.","\u2298 skips the next player, \u21C4 reverses direction (a skip with two players), +2 makes the next player draw two and miss their turn.","\u2726 lets you pick the colour; +4 picks the colour and the next player draws four and misses their turn. No stacking.","First out scores the cards left in the others\u2019 hands: numbers face value, actions 20, wilds 50.","First to 300 points wins the match."],unoControls:"Tap a glowing card to play it (pick a colour for wilds). Tap \u201CDraw\u201D when you can\u2019t play.",mheibesName:"Mheibes",mheibesDesc:"The Baghdadi ring game for two teams.",mheibesDesc2:"Your team against the computer\u2019s, or against a friend online. Hide the ring \u2013 or read their faces and find it.",mhYourTeam:"Your team",mhCompTeam:"Computer team",mhTeamOf:"{name}\u2019s team",mhTo:"to {n}",mhMate:"Teammate {n}",mhRival:"Rival",mhHideHint:"Your turn to hide: tap the fist that will hold the ring",mhTheyHide:"The other team is hiding the ring\u2026",mhTheyGuess:"The other team is searching\u2026",mhPickHint:"Pick one of their fists. Watch for the one that twitches!",mhChoose:"\u201CBat\u201D if it\u2019s empty, \u201CJibah\u201D if it holds the ring",mhBat:"Bat (empty)",mhJib:"Jibah (it\u2019s here)",mhEmpty:"Empty! Keep going",mhThey
