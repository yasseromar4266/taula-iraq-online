nent\u2019s home before any other move.","You must use both dice if possible. If only one can be used, play the higher.","Once all your checkers are home you bear off. A die larger than needed bears off only the farthest checker.","A game is worth 1 point, a mars (loser bore off nothing) 2 points. First to 5 points wins the match."],howControls:"Tap a glowing checker, then a gold point. \u201CUndo\u201D takes back your last move before the turn ends.",footer:"Made in Iraq",hubTitle:"Majlis games",hubText:"Tawla, domino and more \u2014 against the computer or online with friends.",allGames:"All games",soon:"Coming soon",tawlaName:"Tawla",tawlaDesc:"Iraqi Frenji rules, match to five.",dominoName:"Domino",domino:"Domino",dominoDesc:"Iraqi style: 2 or 4 players, the double six starts, match to 101.",xoName:"X-O",xoDesc:"A quick game for two, match to 3.",ludoName:"Ludo",ludoDesc:"2 to 4 players, a six to get out.",kunkanName:"Kunkan",kunkanDesc:"The Iraqi card game.",dTiles:"{n} tiles",dTo:"Match to {n}",dLeftEnd:"Left end",dRightEnd:"Right end",dEmpty:"The table is empty",dRoundOver:"Round over",dTheirTurn:"Opponent\u2019s turn",dPartnerTurn:"Your partner\u2019s turn",dMustLead:"You start: play {t}",dTheyLead:"{name} starts with the double six",dPass:"Nothing fits \u2014 you knock",dChooseSide:"Tap the glowing spot where you want to place it",dYourTurn:"Your turn \u2014 pick a tile that fits",dDraw0:"A tie \u2014 no points",dRoundWon:"You won the round",dRoundLost:"You lost the round",dRoundWonP:"Your team won the round",dRoundLostP:"Your team lost the round",matchWonP:"Your team won the match!",matchLostP:"Your team lost the match",dBlocked:"The game is blocked. Your tiles total {a}, your opponent\u2019s {b}; the lower total wins.",dBlockedP:"The game is blocked. Your team totals {a}, theirs {b}; the lower total wins.",dWentOutMe:"You played all your tiles.",dWentOut:"{name} played all their tiles.",dNextRound:"Next round",dKnock:"Knock",dKnocked:"{names} knocked",dYouKnocked:"Nothing to play \u2014 you knocked",dNoFit:"That tile doesn\u2019t fit either end",dUs:"Us",dThem:"Them",dPartner:"Partner",dPartnerBot:"Partner",dPartnerTag:"partner",dTwo:"2 players",dFour:"4 players (teams)",dQuick2:"Quick match (2)",dRoom2:"Private room for 2",dRoom4:"Private room for 4 (teams)",dFill:"Start now \u2014 the computer fills empty seats",dFillNote:"Wait for friends to join with the code, or start and let the computer play the empty seats. Your partner sits opposite you.",dBotTook:"A player left; the computer took their seat",player:"Player",emptySeat:"Empty seat",shareCode4:"Send the code to your friends. The match starts when four have joined, or you can start it now.",lu_red:"red",lu_green:"green",lu_yellow:"yellow",lu_blue:"blue",luPlayers:"Players",luTapRoll:"Tap the die",luYourRoll:"Your turn \u2014 roll the die",luRollAgain:"A six! Roll again",luPick:"Pick the piece to move",luMoving:"Moving\u2026",luTheirTurn:"{name}\u2019s turn ({color})",luNoMoveMe:"You rolled {n} \u2014 no move",luNoMove:"{name} rolled {n} \u2014 no move",luThreeSixes:"{name}: three sixes in a row, turn lost",luHit:"You sent {name}\u2019s piece home!",luGotHit:"{name} sent your piece home",luHitOther:"{a} sent {b}\u2019s piece home",luWinner:"{name} brought all pieces home and won",luOthers:"Opponents",luStartNow:"Start with who\u2019s here",luStartNote:"Start with whoever has joined (two or more), or let the computer fill the empty seats up to four.",ludoHowTitle:"Ludo rules",ludoHow:["2 to 4 players, each with 4 pieces of their colour.","A piece leaves home only on a 6. A 6 also gives another roll, but three 6s in a row lose the turn.","Pieces go once round the board, then up their own coloured lane to the centre.","Land on an opponent\u2019s piece to send it home \u2014 except on safe squares: the coloured start squares and the stars.","You need the exact number to reach the centre.","First to bring all four pieces to the centre wins."],ludoControls:"Tap the die to roll, then tap a glowing piece. With only one possible move, it moves by itself.",kunkanDesc2:"2 to 5 players, two decks and two jokers, first meld 51.",kPlayers:"players",kOpened:"opened",kNoMelds:"No melds on the table yet",kStock:"Stock",kDiscard:"Discard",kDrawHint:"Your turn: draw from the stock or take the discard",kOpenHint:"Select cards to build groups \u2014 your first meld must be 51 or more. Or select one card and throw it",kPlayHint:"Lay groups, or select a card and tap a meld to add it, then throw a card",kMustOpen:"You took the discard: open with 51 this turn, or put it back",kTheirTurn:"{name}\u2019s turn",kTheyPlay:"{name} is playing\u2026",kAddGroup:"Make group",kLay:"Lay down",kThrow:"Throw",kUntake:"Put back",kSort:"Sort",kConfirmOpen:"Lay all",kRoundWon:"You went out and won the round!",kRoundOver:"Round over",kWinnerIs:"{name} won the round",kNoWinner:"The stock ran out with no winner",kMatchOver:"Match over",kThisRound:"Round",kTotal:"Total",kLowestLeads:"Lowest total leads.",kNextRound:"Next round",kBotTook:"A player left; the computer took their seat",kShareCode:"Send the code to family and friends (up to five). Start with whoever is here, or let the computer fill the rest.",kStartNote:"Start with whoever has joined (two or more), or let the computer fill the empty seats up to five.",kErr_needOpen:"Your first meld must total 51 or more",kErr_badMeld:"That is not a valid group",kErr_needOpenFirst:"Open first before adding to melds",kErr_badLayoff:"That card doesn\u2019t fit this meld",kErr_mustOpen:"You took the discard: open with 51 or put it back",kErr_sameCard:"You can\u2019t throw the card you just took",kErr_notYourTurn:"Not your turn",kunkanHowTitle:"Kunkan rules",kunkanHow:["2 to 5 players, two decks and two jokers (106 cards). The dealer gets 15 cards and throws first; everyone else gets 14.","On your turn: draw from the stock or take the top discard, lay down if you can, then throw one card.","Groups: 3 or 4 of one rank in different suits, or a run of 3+ in one suit. The ace goes low (A 2 3) or high (Q K A), no wrap-around.","A joker stands for any card, but every group needs at least two real cards, and a joker on the table can\u2019t be taken back.","Your first meld must total 51 or more. If you take the discard before opening, you must open that same turn.","Once opened you may add cards to any meld on the table, yours or others\u2019.","Number cards count their value, pictures 10, the ace 1 with low cards and 10 next to the king, a joker as the card it replaces.","First to get rid of all cards wins the round and scores 0. Not opened = 100; opened = the value of the cards left in hand (a joker in hand is 25).","Rounds go on; the lowest total leads. The round winner deals next."],kunkanControls:"Tap the stock or the discard to draw. Tap cards to select them: \u201CMake group\u201D stages your opening until it reaches 51, then \u201CLay all\u201D. After opening, select a card and tap a glowing meld to add it. \u201CThrow\u201D discards the selected card.",snakesName:"Snakes & Ladders",snakesDesc:"Climb the ladders, dodge the snakes.",snakesDesc2:"2 to 4 players. Roll, climb ladders, avoid snakes. First to 100 wins.",slVsComputer:"vs computer",slStart:"Start",slTheirTurn:"{name}\u2019s turn\u2026",slWinner:"{name} reached 100 and won",slLadder:"{name} climbed a ladder to {to}! \u{1FA9C}",slSnake:"{name} was bitten and slid to {to} \u{1F40D}",slOver:"{name} rolled {n} \u2013 needs the exact number",snakesHowTitle:"Snakes & Ladders rules",snakesHow:["2 to 4 players, everyone starts off the board.","Roll the die and move forward that many squares.","Land at the foot of a ladder to climb it; land on a snake\u2019s head to slide down to its tail.","A six gives another roll.","You need the exact number to reach 100; if you overshoot you stay put.","First to 100 wins."],snakesControls:"Tap the die to roll; your piece moves by itself.",unoName:"UNO",unoDesc:"The colours-and-numbers classic.",unoDe
